<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Drive | PMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="page">
<div th:replace="~{fragments/navbar :: nav}"></div>
<main class="landing-main">
<section class="page-header">
    <h1>Edit Placement Drive</h1>
    <p th:text="${company.companyName}">Company</p>
    <a class="btn btn--secondary" th:href="@{/company/dashboard}">Back to Dashboard</a>
</section>

<section class="grid single-column">
    <div class="panel">
        <form class="form" th:action="@{/company/drives/{driveId}/edit(driveId=${driveId})}" th:object="${driveForm}" method="post">
            <input th:field="*{title}" type="text" placeholder="Job title">
            <textarea th:field="*{description}" placeholder="Job description"></textarea>
            <input th:field="*{eligibleBranch}" type="text" placeholder="Eligible branch or ALL">
            <input th:field="*{minimumCgpa}" type="number" step="0.1" placeholder="Minimum CGPA">
            <input th:field="*{location}" type="text" placeholder="Location">
            <input th:field="*{driveDate}" type="date">
            <button class="btn btn--primary" type="submit">Update Drive</button>
        </form>
    </div>
</section>
</main>
</body>
</html>
