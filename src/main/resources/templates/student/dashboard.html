<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="page">
<div th:replace="~{fragments/navbar :: nav}"></div>
<main class="landing-main">
<section class="page-header">
    <h1 th:text="${student.fullName + ' Dashboard'}">Student Dashboard</h1>
    <p th:text="${student.branch + ' | CGPA: ' + student.cgpa + ' | Status: ' + student.placementStatus}">Details</p>
</section>

<div th:if="${successMessage}" class="alert alert--success" th:text="${successMessage}"></div>
<div th:if="${errorMessage}" class="alert alert--error" th:text="${errorMessage}"></div>

<section class="grid">
    <div class="panel">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(73, 106, 143, 0.24); padding-bottom: 12px; margin-bottom: 16px;">
            <h3 style="border-bottom: none; padding-bottom: 0; margin-bottom: 0;">Update Profile</h3>
            <button type="button" class="btn btn--secondary btn--sm" id="editProfileBtn" onclick="toggleProfileEdit()">Edit Profile</button>
        </div>
        <form class="form" id="profileForm" th:action="@{/student/profile}" th:object="${profileForm}" method="post">
            <input th:field="*{fullName}" type="text" placeholder="Full name" readonly>
            <input th:field="*{branch}" type="text" placeholder="Branch" readonly>
            <input th:field="*{cgpa}" type="number" step="0.1" placeholder="CGPA" readonly>
            <textarea th:field="*{skills}" placeholder="Skills" readonly></textarea>
            <input th:field="*{resumeUrl}" type="text" placeholder="Resume file name or URL" readonly>
            <button class="btn btn--primary" id="saveProfileBtn" type="submit" style="display: none;">Save Profile</button>
        </form>
    </div>

    <div class="panel">
        <h3>Available Drives</h3>
        <div th:each="drive : ${drives}" class="card">
            <h4 th:text="${drive.title}">Drive Title</h4>
            <p th:text="${drive.company.companyName}">Company</p>
            <p th:text="${'Eligibility: ' + drive.eligibleBranch + ', Min CGPA: ' + drive.minimumCgpa}">Eligibility</p>
            <form th:action="@{/student/apply/{driveId}(driveId=${drive.id})}" method="post">
                <button class="btn btn--primary" type="submit">Apply</button>
            </form>
        </div>
    </div>

    <div class="panel">
        <h3>Application Status</h3>
        <div th:if="${#lists.isEmpty(applications)}" class="empty">No applications yet.</div>
        <div th:each="jobApplication : ${applications}" class="list-row">
            <strong th:text="${jobApplication.placementDrive.title}">Drive</strong>
            <span>
                <span th:text="${jobApplication.status}">Status</span>
                <span th:if="${jobApplication.interviewAt != null}" th:text="${' | ' + #temporals.format(jobApplication.interviewAt, 'MMM dd, hh:mm a')}" style="color: var(--primary);">Time</span>
            </span>
        </div>
    </div>
</section>
</main>

<script>
    function toggleProfileEdit() {
        const form = document.getElementById('profileForm');
        const inputs = form.querySelectorAll('input, textarea');
        
        inputs.forEach(input => {
            input.removeAttribute('readonly');
        });
        
        // Focus the first input
        if (inputs.length > 0) inputs[0].focus();

        document.getElementById('editProfileBtn').style.display = 'none';
        document.getElementById('saveProfileBtn').style.display = 'inline-flex';
    }
</script>
</body>
</html>
